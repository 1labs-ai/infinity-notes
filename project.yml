name: InfinityNotes
options:
  bundleIdPrefix: com.oneinfinitylabs
  deploymentTarget:
    macOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
targets:
  InfinityNotes:
    type: application
    platform: macOS
    sources: [Sources]
    settings:
      base:
        PRODUCT_NAME: Infinity Notes
        PRODUCT_MODULE_NAME: InfinityNotes
        PRODUCT_BUNDLE_IDENTIFIER: com.oneinfinitylabs.InfinityNotes
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Infinity Notes
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        ENABLE_HARDENED_RUNTIME: NO
  InfinityNotesTests:
    type: bundle.unit-test
    platform: macOS
    sources: [Tests]
    dependencies:
      - target: InfinityNotes
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        # The product name contains a space, so the default test host path doesn't resolve.
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Infinity Notes.app/Contents/MacOS/Infinity Notes"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  InfinityNotes:
    build:
      targets:
        InfinityNotes: all
    test:
      targets: [InfinityNotesTests]
